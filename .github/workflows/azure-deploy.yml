name: Deploy to Azure Container Apps

# 當程式碼推送到 main 分支時，觸發此工作流程
on:
  push:
    branches:
      - main
  workflow_dispatch: # 允許您在 GitHub 網頁上手動觸發執行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出 GitHub 存放庫的原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登入 Azure
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. 建置並部署至 Azure Container Apps
      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          azureCredentials: ${{ secrets.AZURE_CREDENTIALS }}
          containerAppName: raghelperbot
          resourceGroup: raghelperbot-swiss
          # acrName: 請替換為您實際的 ACR 名稱 (例如: myactualacr)
          # 如果您重新建立了同名 ACR (caa60b595935acr)，則可以拔掉下方這一行
          acrName: caa60b595935acr 
          appSourcePath: ${{ github.workspace }}
          # 如果您的 Dockerfile 不在根目錄，請取消下一行的註解並填入正確路徑
          # dockerfilePath: ./Dockerfile 