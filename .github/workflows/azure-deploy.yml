name: Trigger auto deployment for raghelperbot

on:
  push:
    branches: 
      - main
    paths:
      - '**'
      - '.github/workflows/raghelperbot-AutoDeployTrigger-ec3403a1-dd58-47ef-af65-59c26d037db1.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write 
      contents: read 

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4 # 升級至 v4 以支援最新環境

      - name: Azure Login
        uses: azure/login@v3 # 升級至 v3 以完美支援 OIDC
        with:
          client-id: ${{ secrets.RAGHELPERBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RAGHELPERBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RAGHELPERBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          # 修正 A：移除日誌中警告的底線錯誤代碼，改用標準參數
          dockerfilePath: ./Dockerfile 
          
          # 修正 B：補上您先前遺失的 ACR 登錄表名稱
          acrName: caa60b595935acr 
          
          containerAppName: raghelperbot
          resourceGroup: raghelperbot-swiss
          
          # 修正 C：移除不支援的 ARM 模板語法 [parameters(...)]，改為正確的映像名稱格式
          imageToBuild: caa60b595935acr.azurecr.io/raghelperbot:${{ github.sha }}